<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Noé Le Jeune</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/contact.css">
</head>

<body>
    <div id="main-wrapper">
        <header>
            <div class="logo">
                <a href="index.html">
                    <img src="img/pdp.webp" alt="Noé Le Jeune">
                </a>
            </div>
            <nav>
                <a href="apropos.html">À propos</a>
                <a href="projet.html">Projets</a>
                <a href="contact.html" class="active">Contact</a>
            </nav>
        </header>

        <main class="page-container" style="padding-top: 8rem;">
            <section class="contact-section">
                <div class="contact-hero" style="text-align: center; margin-bottom: 4rem;">
                    <h1 class="impact-title">TRAVAILLONS ENSEMBLE</h1>
                    <p>Vous avez un projet en tête ? Parlons-en.</p>
                </div>

                <div class="contact-container" style="max-width: 600px; margin: 0 auto; padding: 0 5%;">
                    <form id="contact-form" class="contact-form">
                        <div class="form-group" style="margin-bottom: 1.5rem;">
                            <label for="email">Email</label>
                            <input type="email" id="email" name="email" required placeholder="votre@email.com"
                                style="width: 100%; padding: 1rem; border-radius: 8px; border: 1px solid #ddd; margin-top: 0.5rem;">
                        </div>

                        <div class="form-group" style="margin-bottom: 1.5rem;">
                            <label for="subject">Sujet</label>
                            <input type="text" id="subject" name="subject" required
                                placeholder="L'objet de votre message"
                                style="width: 100%; padding: 1rem; border-radius: 8px; border: 1px solid #ddd; margin-top: 0.5rem;">
                        </div>

                        <div class="form-group" style="margin-bottom: 2rem;">
                            <label for="message">Message</label>
                            <textarea id="message" name="message" rows="6" required placeholder="Votre message..."
                                style="width: 100%; padding: 1rem; border-radius: 8px; border: 1px solid #ddd; margin-top: 0.5rem;"></textarea>
                        </div>

                        <button type="submit" class="btn primary-btn" style="width: 100%;">Envoyer le message</button>
                    </form>
                </div>
            </section>
        </main>

        <footer>
            <p>&copy; 2026 Noé Lejeune. Tous droits réservés.</p>
        </footer>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script src="./js/contact_form.js"></script>
    <script src="./js/main.js"></script>
</body>

</html>
