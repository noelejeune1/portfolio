<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Noé Le Jeune</title>
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src https://api.emailjs.com; img-src 'self' data:;">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/contact.css">
</head>

<body>
    <div id="main-wrapper">
        <header>
            <div class="logo">
                <a href="index.html">
                    <img src="img/pdp.webp" alt="Noé Le Jeune">
                </a>
            </div>
            <nav>
                <a href="apropos.html">À propos</a>
                <a href="projet.html">Projets</a>
                <a href="contact.html" class="active">Contact</a>
            </nav>
        </header>

        <main class="page-container">
            <section class="contact-section">
                <div class="contact-hero">
                    <h1 class="impact-title">TRAVAILLONS ENSEMBLE</h1>
                    <p>Vous avez un projet en tête ? Parlons-en.</p>
                </div>

                <div class="contact-container">
                    <form id="contact-form" class="contact-form">
                        <!-- Honeypot anti-spam : doit rester vide -->
                        <input type="text" name="honeypot" id="honeypot" tabindex="-1" autocomplete="off" aria-hidden="true">

                        <div class="form-group">
                            <label for="email">Email</label>
                            <input type="email" id="email" name="email" required placeholder="votre@email.com">
                        </div>

                        <div class="form-group">
                            <label for="subject">Sujet</label>
                            <input type="text" id="subject" name="subject" required
                                placeholder="L'objet de votre message">
                        </div>

                        <div class="form-group">
                            <label for="message">Message</label>
                            <textarea id="message" name="message" rows="6" required placeholder="Votre message..."></textarea>
                        </div>

                        <button type="submit" class="btn primary-btn contact-submit">Envoyer le message</button>
                    </form>
                </div>
            </section>
        </main>

        <footer>
            <p>&copy; 2026 Noé Lejeune. Tous droits réservés.</p>
        </footer>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script src="./js/contact_form.js"></script>
    <script src="./js/main.js"></script>
</body>

</html>
